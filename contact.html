<!DOCTYPE html>
<html lang="en" class="bg-[#090a0c] text-[#b0b5c0]">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Timothée Bacher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Newsreader', 'Georgia', 'serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        archive: {
                            bg: '#090a0c',
                            card: '#0f1115',
                            border: '#1e222b',
                            gold: '#c2a370',
                            text: '#c5c9d3',
                            muted: '#6b7280'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #090a0c;
            background-image: radial-gradient(#1e222b 0.75px, transparent 0.75px);
            background-size: 24px 24px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #090a0c; }
        ::-webkit-scrollbar-thumb { background: #1e222b; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2a370; }
    </style>
</head>
<body class="min-h-screen font-serif antialiased selection:bg-archive-gold/20 selection:text-archive-gold flex items-center justify-center">

    <main class="max-w-3xl w-full mx-auto px-6 py-16 md:py-24 space-y-16">

        <header class="text-center space-y-4">
            <a href="index.html" class="font-mono text-[10px] text-archive-gold/60 hover:text-archive-gold transition-colors tracking-wider">? REGESTUM</a>
            <h1 class="text-2xl md:text-4xl font-normal text-white tracking-tight">Contact</h1>
            <p class="text-sm text-archive-muted font-serif italic">I reply to thoughtful messages.</p>
        </header>

        <div class="text-center space-y-6 text-archive-text font-serif leading-relaxed">
            <p class="text-sm">The best way to reach me is by email. I read every message — and I answer.</p>
            <!-- ?? REMPLACEZ timothee@ton-domaine.com par votre vrai email -->
            <a href="mailto:timothe.bacher@gmail.com" class="block text-xl md:text-2xl text-archive-gold hover:text-white transition-colors font-serif">
                timothe.bacher@gmail.com
            </a>
            <p class="text-xs text-archive-muted font-mono mt-6">For product strategy, architecture reviews, or just a conversation.</p>
        </div>

        <footer class="pt-8 border-t border-archive-border/40 text-center space-y-4">
            <a href="index.html" class="text-xs text-archive-muted hover:text-archive-gold transition-colors font-mono">? Return to Regestum</a>
        </footer>

    </main>

</body>
</html>
